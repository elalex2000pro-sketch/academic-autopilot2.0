[project]
name = "academic-autopilot-backend"
version = "0.1.0"
description = "Gestor academico autonomo: sincronizacion Moodle/Google Classroom + planificador"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
