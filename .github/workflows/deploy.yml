name: Deploy

# Al subir cambios a la rama main se reconstruyen las imagenes, se publican en
# GitHub Container Registry y se actualiza la app en la VM automaticamente.
# Tambien se puede lanzar a mano desde la pestana "Actions" (Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Construir y publicar imagenes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Calcular propietario (minusculas) para ghcr.io
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en el registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/academic-autopilot-backend:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/academic-autopilot-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/academic-autopilot-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/academic-autopilot-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en la VM
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Actualizar por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/academic-autopilot
            git pull --ff-only
            ./deploy/server-deploy.sh
