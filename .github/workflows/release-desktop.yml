name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read
  statuses: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release/check.cjs --remote
        env:
          GITHUB_TOKEN: ${{ github.token }}

  windows:
    needs: gate
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Academic-Autopilot-Setup.exe")) {
            throw "No se generó Academic-Autopilot-Setup.exe."
          }
          if (-not (Test-Path "dist/latest.yml")) {
            throw "No se generó latest.yml."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            desktop/dist/Academic-Autopilot-Setup.exe
            desktop/dist/Academic-Autopilot-Setup.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

  macos:
    needs: gate
    name: macOS x64
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build DMG and ZIP
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify macOS artifacts
        run: |
          test -f dist/latest-mac.yml
          test -n "$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.zip' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          if-no-files-found: error

  publish:
    name: Prepare draft only
    permissions:
      contents: write
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate manifest from actual installer
        run: node scripts/release/metadata.cjs release-assets
      - name: Create draft for final owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node scripts/release/check.cjs "$RELEASE_TAG")
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --verify-tag \
            --title "Academic Autopilot v$VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            --draft
