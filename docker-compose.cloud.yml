# Stack pensado para una VM pequeña (p.ej. Google Cloud e2-micro Always Free)
# usando IMAGENES ya construidas por GitHub Actions (no compila en la VM, que
# tiene poca memoria). Las imagenes se publican en GitHub Container Registry.
#
# Uso en el servidor:
#   docker compose -f docker-compose.cloud.yml pull
#   docker compose -f docker-compose.cloud.yml up -d
#
# Variables que deben estar en .env:
#   IMAGE_REGISTRY=ghcr.io/<tu-usuario-github-en-minusculas>
#   IMAGE_TAG=latest
#   SITE_ADDRESS=<dominio>.duckdns.org
#   SECRET_KEY=<aleatoria>
#   POSTGRES_PASSWORD=<fuerte>
#   CORS_ORIGINS=https://<dominio>.duckdns.org
#   CORS_ORIGIN_REGEX=^https://<dominio>\.duckdns\.org$

name: academic-autopilot

x-backend-env: &backend-env
  ENVIRONMENT: production
  SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY en .env}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autopilot}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-academic_autopilot}
  DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-autopilot}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-academic_autopilot}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
  CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-^https://.*$}
  REALTIME_ENABLED: "true"
  BACKEND_PORT: "8000"
  FILES_DIR: /data/files
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://localhost/settings}
  GOOGLE_CLASSROOM_SCOPES: ${GOOGLE_CLASSROOM_SCOPES:-https://www.googleapis.com/auth/classroom.courses.readonly,https://www.googleapis.com/auth/classroom.coursework.me.readonly}
  # IA: en la nube se recomienda Gemini (cada usuario pone su clave en Ajustes).
  AI_ENABLED: ${AI_ENABLED:-true}
  AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-gemini}
  AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-llama3.1}
  AI_GEMINI_MODEL: ${AI_GEMINI_MODEL:-gemini-2.5-flash}
  AI_GEMINI_VISION_MODEL: ${AI_GEMINI_VISION_MODEL:-gemini-2.5-flash}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
  AI_TEMPERATURE: ${AI_TEMPERATURE:-0.3}
  AI_VISION_MODEL: ${AI_VISION_MODEL:-llava}
  AI_MAX_IMAGE_MB: ${AI_MAX_IMAGE_MB:-8}
  AI_TOOLS_ENABLED: ${AI_TOOLS_ENABLED:-true}
  AI_MAX_TOOL_ITERATIONS: ${AI_MAX_TOOL_ITERATIONS:-6}
  ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-pdf,doc,docx,ppt,pptx,xls,xlsx,txt,md,csv,png,jpg,jpeg,gif}
  AI_STUDIO_MAX_CHARS: ${AI_STUDIO_MAX_CHARS:-12000}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-academic_autopilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autopilot} -d ${POSTGRES_DB:-academic_autopilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${IMAGE_REGISTRY:?define IMAGE_REGISTRY en .env}/academic-autopilot-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backend-env
      ENABLE_SCHEDULER: "false"   # el scheduler corre en `worker`
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
    volumes:
      - appfiles:/data/files

  worker:
    image: ${IMAGE_REGISTRY:?define IMAGE_REGISTRY en .env}/academic-autopilot-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "app.workers.run"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      <<: *backend-env
      ENABLE_SCHEDULER: "true"
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}

  frontend:
    image: ${IMAGE_REGISTRY:?define IMAGE_REGISTRY en .env}/academic-autopilot-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # En blanco: el frontend usa el MISMO origen (rutas relativas) tras Caddy.
      NEXT_PUBLIC_API_URL: ""

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?define SITE_ADDRESS en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  appfiles:
  caddydata:
  caddyconfig:
